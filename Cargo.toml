[package]
name = "underkb"
version = "0.1.0"
edition = "2021"
description = "Compress any image under 200 KB — or any size you set."

[dependencies]
resuma = { git = "https://github.com/GoldevLab/resuma.git", rev = "b46901553ce21df9ac40945b703a28faae00a7e9" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
webp = "0.3"
getrandom = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
libsql = { version = "0.9", default-features = false, features = ["remote"] }
